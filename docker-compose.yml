version: '3.8'

services:
  sqlserver:
    build:
      context: .
      dockerfile: Dockerfile.sqlserver
    container_name: library-sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    volumes:
      - sqlserver-data:/var/opt/mssql

  minio:
    image: minio/minio:latest
    container_name: library-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BROWSER_REDIRECT_URL=http://localhost/minio/
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  redis:
    image: redis:alpine
    container_name: library-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  seq:
    image: datalust/seq:latest
    container_name: library-seq
    ports:
      - "5341:80"
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
      - SEQ_API_CANONICALURI=http://localhost/seq/
    volumes:
      - seq-data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library-api
    ports:
      - "5185:5185"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5185
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=LibraryDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__Redis=redis:6379
      - ConnectionStrings__Seq=http://seq:80
      - Jwt__Key=YOUR_SUPER_SECRET_JWT_KEY_THAT_HAS_TO_BE_AT_LEAST_64_CHARACTERS_LONG_FOR_HMAC_SHA512_SIGNING_ALGORITHM
      - MinioSettings__ServiceUrl=http://minio:9000
      - MinioSettings__AccessKey=${MINIO_ROOT_USER}
      - MinioSettings__SecretKey=${MINIO_ROOT_PASSWORD}
    depends_on:
      - sqlserver
      - redis
      - seq
      - minio

  frontend:
    build:
      context: ./library-client
      dockerfile: Dockerfile.frontend
    container_name: library-frontend
    ports:
      - "4200:4200"
    volumes:
      - ./library-client:/app
      - /app/node_modules
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: library-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api
      - minio
      - seq

volumes:
  sqlserver-data:
  minio-data:
  redis-data:
  seq-data:
